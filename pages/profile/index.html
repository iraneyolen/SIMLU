<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil | SI Mahasiswa Labor Unklab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="../../assets/vendor/tailwindcss-browser.js"></script>
  <script src="../../js/boot.js"></script>
</head>
<body data-role="auto" data-page="profile" data-title="Profil" data-subtitle="Data diri dan keamanan akun">
  <main id="main">
    <div class="grid gap-6 lg:grid-cols-[1fr_2fr]">
      <div class="flex flex-col gap-6">
        <section class="panel flex flex-col items-center gap-2 p-6 text-center" id="identityCard"></section>
        <section class="flex flex-col gap-2" id="workCard"><h2>Info kerja</h2><dl class="m-0 divide-y divide-line rounded-xl border border-line bg-surface px-4" id="workInfo"></dl></section>
      </div>
      <div class="flex flex-col gap-6">
        <section class="panel flex flex-col gap-4 p-5">
          <div><h2>Data diri</h2><p class="m-0 text-xs text-ink-2">Nama dan NIM hanya bisa diubah oleh admin</p></div>
          <form id="profileForm" class="grid gap-4 sm:grid-cols-2" novalidate>
            <div><label class="label" for="pName">Nama lengkap</label><input class="input bg-sunken" id="pName" disabled></div>
            <div><label class="label" for="pId">NIM</label><input class="input bg-sunken" id="pId" disabled></div>
            <div><label class="label" for="pEmail">Email</label><input class="input" id="pEmail" type="email" autocomplete="email" required><p class="error-msg">Isi email yang valid.</p></div>
            <div><label class="label" for="pPhone">No. HP / WhatsApp</label><input class="input" id="pPhone" type="tel" autocomplete="tel" required><p class="error-msg">Isi nomor yang bisa dihubungi.</p></div>
            <div class="flex sm:col-span-2 sm:justify-end"><button class="btn btn-primary w-full sm:w-auto" type="submit">Simpan perubahan</button></div>
          </form>
        </section>
        <section class="panel flex flex-col gap-4 p-5">
          <h2>Ubah password</h2>
          <form id="passwordForm" class="grid gap-4 sm:grid-cols-3" novalidate>
            <div><label class="label" for="pwOld">Password lama</label><input class="input" id="pwOld" type="password" autocomplete="current-password" required><p class="error-msg">Isi password lama.</p></div>
            <div><label class="label" for="pwNew">Password baru</label><input class="input" id="pwNew" type="password" placeholder="Minimal 8 karakter" minlength="8" autocomplete="new-password" required><p class="error-msg">Minimal 8 karakter.</p></div>
            <div><label class="label" for="pwNew2">Ulangi password baru</label><input class="input" id="pwNew2" type="password" autocomplete="new-password" required><p class="error-msg">Password tidak sama.</p></div>
            <div class="flex sm:col-span-3 sm:justify-end"><button class="btn btn-secondary w-full sm:w-auto" type="submit">Ubah password</button></div>
          </form>
        </section>
        <section class="flex flex-col gap-3 rounded-xl border border-dashed border-line-strong/60 p-5 sm:flex-row sm:items-center" id="demoSection">
          <div class="flex-1"><h2>Data demo</h2><p class="m-0 text-xs text-ink-2">Kembalikan semua tambah, ubah, hapus, dan absensi ke data awal. Hanya untuk mode demo.</p></div>
          <button class="btn btn-secondary" type="button" id="resetData"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>Reset data demo</button>
        </section>
      </div>
    </div>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/demo-data.js"></script>
  <script src="../../js/store.js"></script>
  <script src="../../js/ui.js"></script>
  <script>store.start(["../../js/layout.js", "../../js/pages/profile.js"])</script>
</body>
</html>
