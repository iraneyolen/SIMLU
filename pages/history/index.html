<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat Absensi | SI Mahasiswa Labor Unklab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="../../assets/vendor/tailwindcss-browser.js"></script>
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="history" data-title="Riwayat Absensi" data-subtitle="Semua catatan check-in dan check-out kamu">
  <main id="main">
    <dl id="statList"></dl>
    <div class="flex flex-wrap items-end gap-3"><div class="w-full sm:w-48"><label class="label" for="monthFilter">Bulan</label><select class="input" id="monthFilter"><option>November 2026</option><option>Oktober 2026</option></select></div><div class="w-full sm:w-48"><label class="label" for="statusFilter">Status</label><select class="input" id="statusFilter"><option>Semua status</option><option>Tepat waktu</option><option>Telat</option><option>Belum check-out</option><option>Izin</option></select></div><div class="flex gap-2 sm:ml-auto"><button class="btn btn-secondary" type="button" id="exportBtn"><i class="ph ph-download-simple" aria-hidden="true"></i>Unduh CSV</button></div></div>
    <section class="flex flex-col gap-3" aria-labelledby="heatTitle">
      <div class="section-title"><h2 id="heatTitle">Kalender kehadiran</h2><span class="text-xs text-ink-2" id="heatMonth"></span></div>
      <div id="heatmap"></div>
    </section>
    <section class="flex flex-col gap-3" aria-labelledby="listTitle">
      <div class="section-title"><h2 id="listTitle">Catatan</h2><span class="text-xs text-ink-2" id="countLabel"></span></div>
      <div id="tableBox"></div>
    </section>
  </main>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/store.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/history.js"></script>
</body>
</html>
