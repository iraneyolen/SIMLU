<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengajuan Â· SIMLU Unklab</title>

  <script src="../../assets/vendor/tailwindcss-browser.js"></script>
  <script src="../../assets/js/tailwind-boot.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Zilla+Slab:wght@600&display=swap" rel="stylesheet">
</head>
<body class="bg-page font-sans text-body">

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex w-60 flex-col bg-primary-900 px-4 py-6 transition-transform max-lg:-translate-x-full" aria-label="Menu utama">
    <a href="../../" class="flex items-center gap-2 px-2 font-semibold text-white">
      <span class="flex h-9 w-9 items-center justify-center rounded-ctl bg-accent text-lg font-bold text-ink">S</span>
      SIMLU Â· Unklab
    </a>
    <nav class="mt-8 flex flex-1 flex-col gap-1">
      <a href="../dashboard/" class="sidebar-item"><i class="bi bi-grid-1x2" aria-hidden="true"></i>Dashboard</a>
      <a href="../schedule/" class="sidebar-item"><i class="bi bi-calendar-week" aria-hidden="true"></i>Jadwal</a>
      <a href="../history/" class="sidebar-item"><i class="bi bi-clock-history" aria-hidden="true"></i>Riwayat</a>
      <a href="../requests/" class="sidebar-item active"><i class="bi bi-arrow-left-right" aria-hidden="true"></i>Pengajuan</a>
      <a href="../profile/" class="sidebar-item"><i class="bi bi-person-circle" aria-hidden="true"></i>Profil</a>
    </nav>
    <button id="btnLogout" class="sidebar-item w-full text-left"><i class="bi bi-box-arrow-left" aria-hidden="true"></i>Keluar</button>
  </aside>
  <div id="backdrop" class="fixed inset-0 z-40 hidden bg-black/40"></div>

  <div class="ml-60 max-lg:ml-0">
    <div class="sticky top-0 z-30 hidden items-center gap-3 border-b border-line bg-white px-4 py-3 max-lg:flex">
      <button id="btnMenu" class="rounded-ctl p-2 text-primary-900 hover:bg-primary-50" aria-label="Buka menu">
        <i class="bi bi-list text-2xl" aria-hidden="true"></i>
      </button>
      <span class="font-semibold text-primary-900">SIMLU Â· Pengajuan</span>
    </div>

    <main class="mx-auto max-w-6xl px-6 py-8 max-md:px-4">
      <h1 class="text-2xl font-bold text-ink">Pengajuan</h1>
      <p class="mt-1 text-sm text-mute">Ajukan izin atau tukar shift. Admin akan meninjau pengajuanmu.</p>

      <div class="mt-6 grid grid-cols-5 gap-6 max-lg:grid-cols-1">
        <!-- Form -->
        <section class="card-soft col-span-2 p-6 max-lg:col-span-1">
          <h2 class="text-base font-semibold text-ink">Ajukan baru</h2>
          <form id="reqForm" class="mt-4 space-y-4" novalidate>
            <div>
              <label class="label" for="type">Jenis pengajuan</label>
              <select class="field" id="type" required>
                <option value="">Pilih jenis</option>
                <option value="Izin">Izin (tidak masuk shift)</option>
                <option value="Tukar Shift">Tukar Shift</option>
              </select>
              <p class="err hidden" id="errType"></p>
            </div>
            <div>
              <label class="label" for="date">Tanggal</label>
              <input class="field" type="date" id="date" required>
              <p class="err hidden" id="errDate"></p>
            </div>
            <div>
              <label class="label" for="reason">Alasan</label>
              <textarea class="field" id="reason" rows="3" style="min-height:96px" placeholder="Jelaskan singkat alasannya" required></textarea>
              <p class="err hidden" id="errReason"></p>
            </div>
            <div id="formAlert" class="hidden rounded-ctl bg-red-50 px-4 py-3 text-sm text-bad" role="alert"></div>
            <button class="btn btn-primary w-full" type="submit">Kirim Pengajuan</button>
          </form>
        </section>

        <!-- Daftar pengajuan -->
        <section class="card-soft col-span-3 overflow-hidden max-lg:col-span-1">
          <h2 class="px-6 pt-5 text-base font-semibold text-ink">Pengajuanmu</h2>
          <table class="mt-3 w-full text-sm">
            <thead>
              <tr class="bg-primary-900 text-left text-white">
                <th class="px-6 py-3 font-medium">Tanggal</th>
                <th class="px-4 py-3 font-medium">Jenis</th>
                <th class="px-4 py-3 font-medium">Alasan</th>
                <th class="px-6 py-3 font-medium">Status</th>
              </tr>
            </thead>
            <tbody id="reqRows" class="divide-y divide-line"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="../../js/db.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    const user = auth.requireRole('student');
    if (user) init();

    function fmtDate(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); }

    async function init() {
      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      await render();
      document.getElementById('reqForm').addEventListener('submit', submit);
    }

    async function render() {
      const rows = (await db.list('requests')).filter(r => r.student_id === user.id)
        .sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById('reqRows').innerHTML = rows.map(r => {
        const cls = r.status === 'Approved' ? 'badge-ok' : r.status === 'Pending' ? 'badge-warn' : 'badge-bad';
        return '<tr><td class="px-6 py-3 text-body">' + fmtDate(r.date) + '</td>' +
          '<td class="px-4 py-3 font-semibold text-ink">' + r.type + '</td>' +
          '<td class="px-4 py-3 text-mute">' + r.reason + '</td>' +
          '<td class="px-6 py-3"><span class="badge ' + cls + '">' + r.status + '</span></td></tr>';
      }).join('') || '<tr><td colspan="4" class="px-6 py-6 text-center text-mute">Belum ada pengajuan.</td></tr>';
    }

    async function submit(e) {
      e.preventDefault();
      ['errType', 'errDate', 'errReason'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('formAlert').classList.add('hidden');

      const type = document.getElementById('type').value;
      const date = document.getElementById('date').value;
      const reason = document.getElementById('reason').value.trim();
      let ok = true;
      if (!type) { document.getElementById('errType').textContent = 'Pilih jenis pengajuan'; document.getElementById('errType').classList.remove('hidden'); ok = false; }
      if (!date) { document.getElementById('errDate').textContent = 'Tanggal wajib diisi'; document.getElementById('errDate').classList.remove('hidden'); ok = false; }
      if (reason.length < 5) { document.getElementById('errReason').textContent = 'Tulis alasan minimal 5 karakter'; document.getElementById('errReason').classList.remove('hidden'); ok = false; }
      if (!ok) return;

      try {
        await db.insert('requests', { student_id: user.id, type, date, reason, status: 'Pending', decided_by: null });
        document.getElementById('reason').value = '';
        await render();
      } catch (err) {
        const alertBox = document.getElementById('formAlert');
        alertBox.textContent = 'Gagal menyimpan: ' + err.message;
        alertBox.classList.remove('hidden');
      }
    }

    // Sidebar (layar kecil)
    const sidebar = document.getElementById('sidebar'), backdrop = document.getElementById('backdrop'), btnMenu = document.getElementById('btnMenu');
    function toggleMenu(open) {
      sidebar.classList.toggle('max-lg:-translate-x-full', !open);
      backdrop.classList.toggle('hidden', !open);
      btnMenu.setAttribute('aria-expanded', String(open));
    }
    btnMenu.addEventListener('click', () => toggleMenu(sidebar.classList.contains('max-lg:-translate-x-full')));
    backdrop.addEventListener('click', () => toggleMenu(false));
    document.getElementById('btnLogout').addEventListener('click', () => { auth.logout(); location.replace(auth.root + 'pages/login/'); });
  </script>
</body>
</html>
