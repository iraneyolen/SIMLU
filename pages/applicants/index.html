<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftar | SI Mahasiswa Labor Unklab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="../../assets/vendor/tailwindcss-browser.js"></script>
  <script src="../../js/boot.js"></script>
</head>
<body data-role="admin" data-page="applicants" data-title="Pendaftar" data-subtitle="Periode Semester Genap 2026/2027, batas 30 November">
  <main id="main">
    <div class="seg self-start" id="statusTabs" role="group" aria-label="Status pendaftar">
      <button type="button" data-value="pending" aria-pressed="true">Menunggu <span class="tabular" id="countPending"></span></button>
      <button type="button" data-value="approved" aria-pressed="false">Disetujui <span class="tabular" id="countApproved"></span></button>
      <button type="button" data-value="rejected" aria-pressed="false">Ditolak <span class="tabular" id="countRejected"></span></button>
    </div>
    <div class="flex flex-wrap items-end gap-3"><div class="w-full sm:w-56"><label class="label" for="searchInput">Cari</label><input class="input" id="searchInput" type="search" placeholder="Nama atau NIM"></div><div class="w-full sm:w-48"><label class="label" for="unitFilter">Unit pilihan</label><select class="input" id="unitFilter"><option>Semua unit</option><option>Perpustakaan</option><option>Kafetaria</option><option>IT Support</option><option>Asrama</option><option>Kebersihan Kampus</option><option>Administrasi</option></select></div><div class="flex gap-2 sm:ml-auto"></div></div>
    <div class="grid items-start gap-6 lg:grid-cols-[1.4fr_1fr]">
      <div id="tableBox"></div>
      <section class="panel flex flex-col gap-4 p-5 lg:sticky lg:top-24" id="detailCard" aria-live="polite"></section>
    </div>
  </main>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/store.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/pages/applicants.js"></script>
</body>
</html>
