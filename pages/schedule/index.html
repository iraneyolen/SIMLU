<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal | SI Mahasiswa Labor Unklab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="../../assets/vendor/tailwindcss-browser.js"></script>
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="schedule" data-title="Jadwal" data-subtitle="Shift kerja dan jadwal kuliah kamu">
  <main id="main">
    <div class="flex flex-wrap items-center gap-3">
      <div class="seg" id="viewTabs" role="group" aria-label="Tampilkan">
        <button type="button" data-value="all" aria-pressed="true">Gabungan</button>
        <button type="button" data-value="shift" aria-pressed="false">Kerja</button>
        <button type="button" data-value="class" aria-pressed="false">Kuliah</button>
      </div>
      <span class="font-semibold tabular sm:ml-auto" id="weekLabel"></span>
    </div>
    <div class="flex flex-wrap gap-x-5 gap-y-2 text-xs text-ink-2" aria-hidden="true">
      <span class="inline-flex items-center gap-2"><span class="size-3 rounded-sm border border-accent bg-accent-soft"></span>Shift kerja</span>
      <span class="inline-flex items-center gap-2"><span class="size-3 rounded-sm border border-line-strong bg-sunken"></span>Kuliah</span>
      <span class="inline-flex items-center gap-2"><span class="size-3 rounded-sm border border-bad bg-bad-soft"></span>Bentrok</span>
    </div>
    <div id="weekGrid"></div>
    <div class="grid gap-6 lg:grid-cols-2">
      <section class="flex flex-col gap-2"><h2>Total jam minggu ini</h2><div id="weekTotal"></div></section>
      <section class="flex flex-col gap-2" id="conflictCard"></section>
    </div>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/demo-data.js"></script>
  <script src="../../js/store.js"></script>
  <script src="../../js/ui.js"></script>
  <script>store.start(["../../js/layout.js", "../../js/pages/schedule.js"])</script>
</body>
</html>
