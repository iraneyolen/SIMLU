<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal · SIMLU Unklab</title>

  <script src="../../assets/vendor/tailwindcss-browser.js"></script>
  <script src="../../assets/js/tailwind-boot.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Zilla+Slab:wght@600&display=swap" rel="stylesheet">
</head>
<body class="bg-page font-sans text-body">

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex w-60 flex-col bg-primary-900 px-4 py-6 transition-transform max-lg:-translate-x-full" aria-label="Menu utama">
    <a href="../../" class="flex items-center gap-2 px-2 font-semibold text-white">
      <span class="flex h-9 w-9 items-center justify-center rounded-ctl bg-accent text-lg font-bold text-ink">S</span>
      SIMLU · Unklab
    </a>
    <nav class="mt-8 flex flex-1 flex-col gap-1">
      <a href="../dashboard/" class="sidebar-item"><i class="bi bi-grid-1x2" aria-hidden="true"></i>Dashboard</a>
      <a href="../schedule/" class="sidebar-item active"><i class="bi bi-calendar-week" aria-hidden="true"></i>Jadwal</a>
      <a href="../history/" class="sidebar-item"><i class="bi bi-clock-history" aria-hidden="true"></i>Riwayat</a>
      <a href="../requests/" class="sidebar-item"><i class="bi bi-arrow-left-right" aria-hidden="true"></i>Pengajuan</a>
      <a href="../profile/" class="sidebar-item"><i class="bi bi-person-circle" aria-hidden="true"></i>Profil</a>
    </nav>
    <button id="btnLogout" class="sidebar-item w-full text-left"><i class="bi bi-box-arrow-left" aria-hidden="true"></i>Keluar</button>
  </aside>
  <div id="backdrop" class="fixed inset-0 z-40 hidden bg-black/40"></div>

  <div class="ml-60 max-lg:ml-0">
    <div class="sticky top-0 z-30 hidden items-center gap-3 border-b border-line bg-white px-4 py-3 max-lg:flex">
      <button id="btnMenu" class="rounded-ctl p-2 text-primary-900 hover:bg-primary-50" aria-label="Buka menu">
        <i class="bi bi-list text-2xl" aria-hidden="true"></i>
      </button>
      <span class="font-semibold text-primary-900">SIMLU · Jadwal</span>
    </div>

    <main class="mx-auto max-w-6xl px-6 py-8 max-md:px-4">
      <h1 class="text-2xl font-bold text-ink">Jadwal</h1>
      <p class="mt-1 text-sm text-mute" id="meta">Memuatâ€¦</p>

      <!-- Shift kerja minggu ini -->
      <section class="card-soft mt-6 overflow-hidden">
        <h2 class="px-6 pt-5 text-lg font-semibold text-ink">Shift kerja</h2>
        <div class="mt-3 overflow-x-auto"><table class="w-full text-sm min-w-[600px]">
          <thead>
            <tr class="bg-primary-900 text-left text-white">
              <th class="px-6 py-3 font-medium">Tanggal</th>
              <th class="px-4 py-3 font-medium">Unit</th>
              <th class="px-4 py-3 font-medium">Lokasi</th>
              <th class="px-6 py-3 font-medium">Jam</th>
            </tr>
          </thead>
          <tbody id="shiftRows" class="divide-y divide-line"></tbody>
        </table></div>
      </section>

      <!-- Jadwal kuliah -->
      <section class="mt-6">
        <h2 class="text-lg font-semibold text-ink">Jadwal kuliah <span class="text-sm font-normal text-mute" id="classMeta"></span></h2>
        <div class="mt-4 grid grid-cols-5 gap-4 max-xl:grid-cols-3 max-lg:grid-cols-2 max-sm:grid-cols-1" id="classGrid"></div>
      </section>
    </main>
  </div>

  <script src="../../js/db.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    const user = auth.requireRole('student');
    if (user) init().catch(db.fail);

    function fmtDate(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); }
    const DAYS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];

    async function init() {
      document.getElementById('meta').textContent = user.program + ' · Semester 1 · TA 2026/2027';

      const shifts = await db.list('shifts');
      const mine = shifts.filter(s => s.student_id === user.id).sort((a, b) => a.date.localeCompare(b.date));
      document.getElementById('shiftRows').innerHTML = mine.length ? mine.map(s =>
        '<tr><td class="px-6 py-3 text-body">' + fmtDate(s.date) + '</td>' +
        '<td class="px-4 py-3 text-body">' + s.unit + '</td>' +
        '<td class="px-4 py-3 text-body">' + s.location + '</td>' +
        '<td class="px-6 py-3 font-mono">' + s.start + ' - ' + s.end + '</td></tr>'
      ).join('') : '<tr><td colspan="4" class="px-6 py-6 text-center text-mute">Belum ada shift terjadwal.</td></tr>';

      const data = await db.list('class-schedule');
      document.getElementById('classMeta').textContent = '· ' + data.semester;
      document.getElementById('classGrid').innerHTML = DAYS.map(day => {
        const courses = data.courses.filter(c => c.days.includes(day));
        return '<div class="card-soft p-5">' +
          '<h3 class="text-sm font-bold uppercase tracking-wide text-primary-900">' + day + '</h3>' +
          (courses.length ? '<ul class="mt-3 space-y-3 text-sm">' + courses.map(c =>
            '<li><p class="font-semibold text-ink">' + c.name + (c.section ? ' · ' + c.section : '') + '</p>' +
            '<p class="mt-0.5 font-mono text-xs text-mute">' + c.start + ' - ' + c.end + ' · ' + c.room + '</p>' +
            (c.teachers.length ? '<p class="text-xs text-mute">' + c.teachers.join(', ') + '</p>' : '') +
            '</li>').join('') + '</ul>'
          : '<p class="mt-3 text-sm text-mute">Tidak ada kelas</p>') +
          '</div>';
      }).join('');
    }

    // Sidebar (layar kecil)
    const sidebar = document.getElementById('sidebar'), backdrop = document.getElementById('backdrop'), btnMenu = document.getElementById('btnMenu');
    function toggleMenu(open) {
      sidebar.classList.toggle('max-lg:-translate-x-full', !open);
      backdrop.classList.toggle('hidden', !open);
      btnMenu.setAttribute('aria-expanded', String(open));
    }
    btnMenu.addEventListener('click', () => toggleMenu(sidebar.classList.contains('max-lg:-translate-x-full')));
    backdrop.addEventListener('click', () => toggleMenu(false));
    document.getElementById('btnLogout').addEventListener('click', () => { auth.logout(); location.replace(auth.root + 'pages/login/'); });
  </script>
</body>
</html>
